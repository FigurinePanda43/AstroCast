name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.9
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the frontend module syntax
        run: node --check custom_components/astrocast/frontend/astrocast-card.js

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: python -m pytest tests -q -p no:cacheprovider
