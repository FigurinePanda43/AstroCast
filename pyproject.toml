[project]
name = "astrocast"
version = "0.1.0"
description = "Astronomy and astrophotography forecasts for Home Assistant"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:astronomy"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts/build_catalog.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "D", "ASYNC", "BLE", "C4", "PIE", "RET", "TRY"]
ignore = [
  "D202", "D203", "D213", "D105", "D107",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917",
  "TRY003", "TRY300", "RUF001", "RUF002", "RUF003", "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
